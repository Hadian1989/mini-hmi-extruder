<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mini-HMI Extruder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e2430;
            color: #eee;
            padding: 20px;
        }

        .panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .karte {
            background: #2c3445;
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
            border-top: 4px solid #5a6577;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .wert {
            font-size: 40px;
            font-weight: bold;
        }
        .status {
            padding: 6px 14px;
            border-radius: 10px;
            background: #5a6577;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }

        .status.laeuft {
            background: #2e7d32;
        }

        .status.anfahren {
            background: #f9a825;
            color: #1e2430;
        }

        .status.notaus-aktiv {
            background: #c62828;
        }

        .alarm {
            color: red;
        }

        .alarmText {
            animation: blinken 1s infinite;
            font-weight: bold;
        }

        @keyframes blinken {
            50% {
                opacity: 0.3;
            }
        }
        .notaus {
            background: #c00;
            color: white;
            font-weight: bold;
        }


        button {
            font-size: 16px;
            padding: 10px 22px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #4a5468;
            color: #fff;
        }

        button:hover:not(:disabled) {
            filter: brightness(1.2);
        }

        #btnStart {
            background: #2e7d32;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            color: white;
        }

        #alarmListe {
            max-height: 180px;
            overflow-y: auto;
            padding-left: 18px;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>
<h1>Extruder-Heizzonen</h1>

<div class="panel">
    <div class="karte">
        <h2>Motor</h2>
        <span id="status" class="status">steht</span>
        <p>
            <button id="btnStart">Start</button>
            <button id="btnStopp">Stopp</button>
            <button id="btnNotAus" class="notaus">NOT-AUS</button>
            <button id="btnQuittieren" hidden>Quittieren</button>
        </p>
    </div>


    <div class="karte">
        <h2>Alarmprotokoll</h2>
        <p>Alarme und Ereignisse!</p>
        <ul id="alarmListe"></ul>
    </div>
    <div id="zonenPanel" class="panel"></div>
</div>

<script>
    const MIN_GRENZE = 50;
    const MAX_GRENZE = 250;

    let laeuft = false;
    let notAus = false;
    let anfahren = false;
    let aktuellerSchritt = '';
    const SCHRITTE = ['Heizzonen prüfen', 'Schmierung einschalten', 'Motor anfahren'];
    const zonen = [
        {name: 'Zone 1', temperatur: 20, grenzwert: 80, heizrate: 5, alarmWarAktiv: false},
        {name: 'Zone 2', temperatur: 20, grenzwert: 90, heizrate: 4, alarmWarAktiv: false},
        {name: 'Zone 3', temperatur: 20, grenzwert: 100, heizrate: 3, alarmWarAktiv: false}
    ];

    // 2. Elemente aus dem HTML holen
    const statusEl = document.querySelector('#status');
    const btnStart = document.querySelector('#btnStart');
    const btnStopp = document.querySelector('#btnStopp');
    const btnNotAus = document.querySelector('#btnNotAus');
    const btnQuittieren = document.querySelector('#btnQuittieren');
    const alarmListeEl = document.querySelector('#alarmListe');
    const zonenPanel = document.querySelector('#zonenPanel');


    // 3. Anzeige aktualisieren
    function render() {
        zonen.forEach((zone, index) => {
            const karte = zonenPanel.querySelector(`[data-index="${index}"]`);
            const temp = karte.querySelector('.temperatur');
            const alarmEl = karte.querySelector('.alarmText');
            temp.textContent = zone.temperatur;
            temp.classList.toggle('alarm', zone.temperatur > zone.grenzwert);
            alarmEl.hidden = !istAlarm(zone);
        });
        statusEl.classList.toggle('laeuft', laeuft);
        statusEl.classList.toggle('anfahren', anfahren);
        statusEl.classList.toggle('notaus-aktiv', notAus);
        statusEl.textContent = statusText();
        btnStart.disabled = notAus || anfahren;
        btnQuittieren.hidden = !notAus;
    }

    function statusText() {
        if (notAus) {
            return 'NOT-AUS';
        } else if (laeuft) {
            return 'läuft';
        } else if (anfahren) {
            return 'Anfahren: ' + aktuellerSchritt;
        }
        return 'steht';
    }

    function zonenKarteErstellen() {
        zonen.forEach((zone, index) => {
            const karte = document.createElement('div');
            karte.className = 'karte';
            karte.dataset.index = index;
            karte.innerHTML = `
            <h2>${zone.name}</h2>
            <span class="temperatur wert">${zone.temperatur}</span> °C
            <p class="alarm alarmText" hidden>⚠ Übertemperatur!</p>
            <div>
             <label>Grenzwert (°C)
                     <input type="number" class="grenzwertInput" data-index="${index}" value="${zone.grenzwert}" min="50" max="250" step="5">
             </label>
            </div>
           `;
            zonenPanel.append(karte);
        });
    }

    function istAlarm(zone) {
        return zone.temperatur > zone.grenzwert;
    }

    function pruefeAlarm(zone) {
        const alarmIstAktiv = istAlarm(zone);
        if (alarmIstAktiv && !zone.alarmWarAktiv) {
            eintragHinzufugen(`${zone.name}: Übertemperatur (${zone.temperatur} °C)`);
        }
        zone.alarmWarAktiv = alarmIstAktiv;
    }

    function warte(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function eintragHinzufugen(text) {
        const zeit = new Date().toLocaleTimeString('de-DE');
        const eintrag = document.createElement('li');
        eintrag.textContent = `${zeit} - ${text}`;
        alarmListeEl.prepend(eintrag);
    }

    btnStart.addEventListener('click', async () => {
        if (notAus || anfahren || laeuft) return;

        anfahren = true;
        eintragHinzufugen('Anfahren gestartet.');
        for (const schritt of SCHRITTE) {
            aktuellerSchritt = schritt;
            render();
            await warte(1500);
            if (!anfahren) {
                eintragHinzufugen('Anfahren abgebrochen.');
                render();
                return;
            }
        }
        anfahren = false;
        laeuft = true;
        eintragHinzufugen("Maschine läuft.");
        render();
    });
    btnStopp.addEventListener('click', () => {
        laeuft = false;
        anfahren = false;
        render();
    });

    btnNotAus.addEventListener('click', () => {
        notAus = true;
        laeuft = false;
        anfahren = false;
        eintragHinzufugen('NOT-AUS ausgelöst');
        render();
    });

    btnQuittieren.addEventListener('click', () => {
        notAus = false;
        laeuft = false;
        anfahren = false;
        eintragHinzufugen(`NOT-AUS quittiert`);
        render();
    });
    zonenPanel.addEventListener('change', (event) => {
        if (!event.target.matches('.grenzwertInput')) return;   // nur unsere Felder
        const index = Number(event.target.dataset.index);        // welche Zone?
        const zone = zonen[index];
        const wert = Number(event.target.value);
        if (event.target.value.trim() !== '' && !Number.isNaN(wert)) {
            zone.grenzwert = Math.min(MAX_GRENZE, Math.max(MIN_GRENZE, wert));
            pruefeAlarm(zone);
            render();
        }
        event.target.value = zone.grenzwert;
    });

    setInterval(() => {
        zonen.forEach(zone => {
            if (laeuft) {
                zone.temperatur = zone.temperatur + zone.heizrate;
            } else {
                zone.temperatur = Math.max(20, zone.temperatur - 2);
            }
            pruefeAlarm(zone);
        })
        render();
    }, 1000);
    zonenKarteErstellen();
    render();
</script>
</body>
</html>
